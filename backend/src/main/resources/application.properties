spring.application.name=protectoretis

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres

spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none

# Executar els scripts d'inicializació SQL (schema.sql) al arrencar
spring.sql.init.mode=always

# Desactivar ddl-auto de Hibernate perquè no interfireixi
spring.jpa.hibernate.ddl-auto=none

# Asegurar que el Script SQL es llenci desprès d'inizialitzar el Datasource
spring.jpa.defer-datasource-initialization=true