spring.application.name=protectoretis

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres

spring.datasource.username=DATABASE_NAME
spring.datasource.password=DATABASE_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none

spring.sql.init.schema-locations=classpath:bdd/user.sql
spring.sql.init.mode=always
# Executar els scripts d'inicializació SQL (schema.sql) al arrencar
spring.sql.init.mode=always

# Desactivar ddl-auto de Hibernate perquè no interfireixi
spring.jpa.hibernate.ddl-auto=none

# Asegurar que el Script SQL es llenci desprès d'inizialitzar el Datasource
spring.jpa.defer-datasource-initialization=true

spring.security.oauth2.client.registration.google.client-id=GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email
